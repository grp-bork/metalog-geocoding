[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metalog-geocoding"
description = "Offline reverse geocoder mapping (lat, lon) to a land admin hierarchy (Natural Earth) or a sea (IHO) with a Longhurst province"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Kuhn", email = "michael.kuhn@gmail.com" }]
keywords = ["reverse-geocoding", "metagenomics", "natural-earth", "iho", "longhurst"]
dynamic = ["version"]

# The base install is ~0.2 MB plus requests: the cache, the MarineRegions
# hierarchy walk, the naming tables and the hierarchy-table readers -- enough
# to read a hierarchy back. Computing one needs `[geo]`.
dependencies = [
    "requests>=2.28",
]

[project.urls]
Repository = "https://github.com/grp-bork/metalog-geocoding"

[project.optional-dependencies]
# ~353 MB installed (including bytecode): pyarrow 120, pandas 71, pyogrio 70,
# numpy 32, pyproj 17, shapely 7, geopandas 3. All of it installs from wheels
# on CPython 3.14; no GDAL source build. See docs/development.md for why the
# dataframe stack stays despite most of the weight not being geopandas.
#
# Every bound here is a lower bound.
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.4",
    # No upper bound: pandas 2 and 3 produce byte-identical results.
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
]

# Progress bars for `scripts/geocode.py`. Not used by the library.
scripts = [
    "tqdm>=4.0",
]

# The HTTP service in service/ (Flask + gunicorn). Only where the service
# runs: callers use `metalog_geocoding.client`, which needs only the base
# install.
service = [
    "flask>=3.0",
    "gunicorn>=22",
]

# pytest only, no plugins. The stdlib-only tests need nothing else; the
# `geo`-marked ones need `[geo]` plus the boundary layers and skip without them.
test = [
    "pytest>=8.0",
]

[tool.setuptools]
# Explicit, because the flat layout has `scripts/` and `service/` beside the
# package. `scripts/` is a standalone harness and is not distributed.
packages = ["metalog_geocoding"]
package-data = { metalog_geocoding = ["vocab/*.txt", "vocab/*.tsv"] }

[tool.setuptools.dynamic]
version = { attr = "metalog_geocoding.__version__" }

[tool.pytest.ini_options]
# Load-bearing: the repo root may hold ad-hoc `test_*.py` exploration scripts
# that geocode at import time and write to `cache/`. Real tests live in
# `tests/` only.
testpaths = ["tests"]
markers = [
    "geo: needs the [geo] extra and the boundary layers; skipped without them",
]
# A misspelt marker would otherwise leave a `geo` test running in the
# bare-install job.
addopts = "--strict-markers"
